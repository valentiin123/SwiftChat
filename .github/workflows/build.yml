name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build SwiftChat
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Archive
        run: |
          xcodebuild clean archive \
            -project "SwiftChat.xcodeproj" \
            -scheme "SwiftChat" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $PWD/build/SwiftChat.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build
          mkdir -p Payload
          cp -R SwiftChat.xcarchive/Products/Applications/SwiftChat.app Payload/
          zip -r SwiftChat.ipa Payload

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/SwiftChat.ipa
